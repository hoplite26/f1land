<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Pulse Arena — props showcase</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05070a; overflow: hidden; font-family: ui-monospace, Menlo, monospace; }
      #app { position: fixed; inset: 0; }
      #hud {
        position: fixed; left: 10px; top: 10px; padding: 8px 10px; border-radius: 8px;
        background: rgba(5, 10, 8, 0.72); color: #d8ffe0; font-size: 12px; line-height: 1.45;
        border: 1px solid rgba(182, 255, 59, 0.35); pointer-events: none; white-space: pre; z-index: 2;
      }
      #hud b { color: #b6ff3b; }
      #nav { position: fixed; right: 10px; top: 10px; display: flex; flex-wrap: wrap; gap: 4px; max-width: 520px; justify-content: flex-end; z-index: 2; }
      #nav a { color: #cfe; background: rgba(0,0,0,.55); padding: 3px 6px; border-radius: 6px; font-size: 11px; text-decoration: none; }
      #nav a.on { background: #b6ff3b; color: #000; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">loading…</div>
    <div id="nav"></div>
    <script type="module" src="./props.ts"></script>
  </body>
</html>
